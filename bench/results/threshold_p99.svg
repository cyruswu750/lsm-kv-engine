<text x="70" y="310">bars: median; lines: min to max of the repetitions</text>
<text x="10" y="330" font-size="11">Synchronous latency varied over time during this run; the cause was not isolated:</text>
<text x="10" y="346" font-size="11">insert p50 was about 4.5 ms in the first two runs (20:36-20:38) and 6.6-7.0 ms</text>
<text x="10" y="362" font-size="11">in all ten runs from 20:39 on; the cause was not measured. These latency and</text>
<text x="10" y="378" font-size="11">throughput figures therefore cannot establish the causal effect of the</text>
<text x="10" y="394" font-size="11">threshold on latency. Per-run values: NOTES.md.</text>
