name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      # Required M1 differential load: 20 seeds (registered test instances)
      # x 5000 operations, reopening every 500 operations. Pinned here so a
      # change to the in-code defaults cannot silently shrink the CI run.
      KV_DIFF_FIRST_SEED: "1"
      KV_DIFF_OPS: "5000"
      KV_DIFF_REOPEN_EVERY: "500"
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DKV_SANITIZE=ON -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        # Every test uses its own temporary directory, so tests can run in
        # parallel. The differential DB seeds are fsync-bound.
        run: ctest --test-dir build --output-on-failure --parallel "$(nproc)" --timeout 1200
